<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Router Security Analyzer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #222;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #3f7579;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #3f7579;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Router Security Analyzer</h1>

    <p class="description">
        Enter the Cisco router SSH credentials.
    </p>

    <form id="routerForm">

        <label for="host">Router IP Address</label>
        <input
            type="text"
            id="host"
            name="host"
            placeholder="192.168.8.151"
            required
        >

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="admin"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit" id="connectButton">
            Connect to Router
        </button>

    </form>

    <div id="status"></div>

</div>

<script>

    const form = document.getElementById("routerForm");
    const button = document.getElementById("connectButton");
    const status = document.getElementById("status");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const host = document.getElementById("host").value;
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        button.disabled = true;
        button.textContent = "Connecting...";

        status.textContent = "Connecting to router...";

        try {

            const response = await fetch("/connect", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    host: host,
                    username: username,
                    password: password
                })
            });

            const result = await response.json();

            if (response.ok) {

                status.textContent = result.message;

            } else {

                status.textContent = "Error: " + result.error;

            }

        } catch (error) {

            status.textContent =
                "Could not connect to the Python server.";

        }

        button.disabled = false;
        button.textContent = "Connect to Router";

    });

</script>

</body>
</html>
